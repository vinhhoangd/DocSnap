name: DocSnap
options:
  bundleIdPrefix: com.vinhhoang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(DOCSNAP_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
targets:
  DocSnap:
    type: application
    platform: iOS
    sources:
      - path: DocSnap
    info:
      path: DocSnap/Info.plist
      properties:
        CFBundleDisplayName: DocSnap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: DocSnap uses the camera to scan your paper documents.
        NSPhotoLibraryAddUsageDescription: DocSnap saves scanned pages to your photo library when you choose Save Image.
        ITSAppUsesNonExemptEncryption: false
        # Answer server address and app token come from Config/Local.xcconfig (git-ignored).
        DocSnapAPIURL: $(DOCSNAP_API_URL)
        DocSnapAppToken: $(DOCSNAP_APP_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOCSNAP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  DocSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DocSnapTests
    dependencies:
      - target: DocSnap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DOCSNAP_BUNDLE_ID).tests
  DocSnapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DocSnapUITests
    dependencies:
      - target: DocSnap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(DOCSNAP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: DocSnap
schemes:
  DocSnap:
    build:
      targets:
        DocSnap: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DocSnapTests
        - DocSnapUITests
    run:
      config: Debug
    archive:
      config: Release
