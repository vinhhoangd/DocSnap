<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#22D3EE"/>
      <stop offset="0.8" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="glow" x="-10%" y="-300%" width="120%" height="700%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="page"><rect x="332" y="232" width="360" height="560" rx="42"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="420" cy="360" r="220" fill="#1D4ED8" filter="url(#blur)"/>
    <circle cx="610" cy="700" r="200" fill="#0E7490" filter="url(#blur)"/>
  </g>
  <rect x="340" y="252" width="360" height="560" rx="42" fill="#000000" fill-opacity="0.35" filter="url(#shadow)"/>
  <rect x="332" y="232" width="360" height="560" rx="42" fill="url(#sheen)"/>
  <g clip-path="url(#page)">
    <path d="M332 232H520L332 540Z" fill="#FFFFFF" fill-opacity="0.08"/>
  </g>
  <rect x="334" y="234" width="356" height="556" rx="40" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="#FFFFFF" fill-opacity="0.45">
    <rect x="388" y="320" width="200" height="22" rx="11"/>
    <rect x="388" y="378" width="246" height="22" rx="11"/>
    <rect x="388" y="436" width="170" height="22" rx="11"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.95">
    <rect x="388" y="580" width="230" height="22" rx="11"/>
    <rect x="388" y="638" width="180" height="22" rx="11"/>
    <rect x="388" y="696" width="210" height="22" rx="11"/>
  </g>
  <rect x="210" y="494" width="604" height="56" rx="28" fill="url(#beam)" filter="url(#glow)"/>
  <rect x="210" y="512" width="604" height="18" rx="9" fill="url(#beam)"/>
  <rect x="300" y="518" width="424" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/>
</svg>
